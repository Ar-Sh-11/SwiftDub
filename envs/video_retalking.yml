# VideoReTalking isolated conda env
# Needs torch 1.9 + CUDA 11.1; cannot share env with newer models

name: swiftdub-videoretalking
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8         # repo tested on 3.8
  - pip
  - ffmpeg
  - cmake              # required to build dlib
  - pip:
    - torch==1.9.0+cu111
    - torchvision==0.10.0+cu111
    - torchaudio==0.9.0
    - --extra-index-url https://download.pytorch.org/whl/torch_stable.html
    - basicsr==1.4.2
    - kornia==0.5.1
    - face-alignment==1.3.4
    - ninja==1.10.2.3
    - einops==0.4.1
    - facexlib==0.2.5
    - librosa==0.9.2
    - dlib==19.24.0
    - numpy==1.23.4
    - opencv-python-headless>=4.6
    - imageio-ffmpeg>=0.4
    - tqdm
    - loguru
