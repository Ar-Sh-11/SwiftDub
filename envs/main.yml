# Main SwiftDub conda environment
# Works for: API server, Wav2Lip, VideoReTalking, LatentSync, SadTalker
# GPU: use extra-index-url for CUDA build of PyTorch (see create_envs script)

name: swiftdub
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - git
  - ffmpeg                  # system ffmpeg (avoids imageio-ffmpeg fallback)
  - pip:
    # ── API stack ──
    - fastapi>=0.110
    - uvicorn[standard]>=0.27
    - python-multipart>=0.0.9
    - pydantic-settings>=2.2
    - motor>=3.3             # async MongoDB driver
    - redis>=5.0          # redis.asyncio replaces aioredis (Python 3.11 safe)
    - celery[redis]>=5.3
    - flower>=2.0            # Celery web monitor
    - prometheus-client>=0.20
    - starlette-prometheus>=0.9
    - aiofiles>=23.0
    - httpx>=0.27
    # ── PyTorch (CPU; GPU overridden by create_envs script) ──
    - torch==2.1.2
    - torchvision==0.16.2
    - torchaudio==2.1.2
    # ── CV / Audio ──
    - opencv-python>=4.9
    - librosa==0.9.2         # pinned — Wav2Lip audio.py uses positional mel() args
    - soundfile>=0.12
    - imageio-ffmpeg>=0.4    # bundled ffmpeg fallback
    - scipy>=1.11
    - numpy>=1.24,<2.0
    - pillow>=10.0
    - scikit-image>=0.21
    # ── HuggingFace / Diffusion ──
    - diffusers>=0.26
    - transformers>=4.38
    - accelerate>=0.27
    - huggingface_hub>=0.21
    - safetensors>=0.4
    # ── Model-specific ──
    - omegaconf>=2.3
    - einops>=0.7
    - timm>=0.9
    - facexlib>=0.3
    - gfpgan>=1.3
    - basicsr>=1.4
    - realesrgan>=0.3
    - DeepCache>=0.1
    - face-alignment>=1.3
    # ── Download helpers ──
    - gdown>=4.7
    - yt-dlp>=2024.1
    # ── Observability ──
    - loguru>=0.7
    - rich>=13.0
    # ── Training / eval ──
    - lpips>=0.1
    - tqdm>=4.66
    - PyYAML>=6.0
    - python-dotenv>=1.0
    - pandas>=2.0
    - matplotlib>=3.8
