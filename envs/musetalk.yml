# MuseTalk conda environment  
# Separate env because mmcv / mmdet / mmpose conflict with main env

name: swiftdub-musetalk
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - ffmpeg
  - pip:
    - torch==2.1.2
    - torchvision==0.16.2
    - torchaudio==2.1.2
    - numpy>=1.24,<2.0
    - opencv-python>=4.9
    - pillow>=10.0
    - diffusers>=0.26
    - transformers>=4.38
    - accelerate>=0.27
    - huggingface_hub>=0.21
    - openmim>=0.3
    - mmengine>=0.10
    - mmcv==2.0.1           # pinned — MuseTalk v1.5 requirement
    - mmdet==3.1.0
    - mmpose==1.1.0
    - imageio>=2.33
    - imageio-ffmpeg>=0.4
    - soundfile>=0.12
    - librosa>=0.10
    - PyYAML>=6.0
    - loguru>=0.7
    - tqdm>=4.66
